[package]
name = "noct-cpu"
version = "0.1.0"
edition = "2024"

[dependencies]
cfg-if = "1.0.4"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
spin = "0.12.3"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
x86 = "0.52.0"

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15.4"

