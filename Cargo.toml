[lib]
crate-type = [ "staticlib" ]

[package]
name = "nocturne"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/noct-sync",
    "crates/noct-spec",
    "crates/noct-tools", "crates/noct-cpuregs", "crates/noct-interrupts", "crates/noct-logger", "crates/noct-time", "crates/noct-ps2", "crates/noct-pci", "crates/noct-smbios", "crates/noct-paging", "crates/noct-physmem-alloc", "crates/noct-sysinfo",
    "crates/noct-mbr",
    "crates/noct-diskman", "crates/noct-fsman", "crates/noct-tarfs", "crates/noct-memdisk", "crates/noct-boot",
]
resolver = "2"

[dependencies]
x86 = "0.52.0"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
spin = "0.10.0"
elf = { version = "0.8.0", default-features = false }
bitflags = "2.10.0"
cfg-if = "1.0.4"

noct-cpuregs = { path = "crates/noct-cpuregs" }
noct-logger = { path = "crates/noct-logger" }
noct-interrupts = { path = "crates/noct-interrupts" }
noct-sync = { path = "crates/noct-sync" }
noct-spec = { path = "crates/noct-spec" }
noct-time = { path = "crates/noct-time" }
noct-paging = { path = "crates/noct-paging" }
noct-ps2 = { path = "crates/noct-ps2" }
noct-physmem-alloc = { path = "crates/noct-physmem-alloc" }
noct-pci = { path = "crates/noct-pci" }
noct-smbios = { path = "crates/noct-smbios" }
noct-sysinfo = { path = "crates/noct-sysinfo" }
noct-tools = { path = "crates/noct-tools" }
noct-diskman = { path = "crates/noct-diskman" }
noct-fsman = { path = "crates/noct-fsman" }
noct-iso9660 = { path = "crates/noct-iso9660" }
noct-tarfs = { path = "crates/noct-tarfs" }
noct-memdisk = { path = "crates/noct-memdisk" }
noct-boot = { path = "crates/noct-boot" }


# Profiles

[profile.release]
panic = "abort"
lto = true
strip = true
opt-level = 2

[profile.release_no_opt]
inherits = "release"
opt-level = 0

[profile.dev]
panic = "abort"
strip = true
lto = true
opt-level = 0
codegen-units = 1
