[lib]
crate-type = ["staticlib"]

[package]
name = "nocturne"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/noct-sync",
    "crates/noct-spec",
    "crates/noct-tools",
    "crates/noct-cpu",
    "crates/noct-interrupts",
    "crates/noct-logger",
    "crates/noct-time",
    "crates/noct-ps2",
    "crates/noct-pci",
    "crates/noct-smbios",
    "crates/noct-physmem-alloc",
    "crates/noct-sysinfo",
    "crates/noct-mbr",
    "crates/noct-diskman",
    "crates/noct-fsman",
    "crates/noct-tarfs",
    "crates/noct-memdisk",
    "crates/noct-boot",
    "crates/noct-mem",
    "crates/noct-sched",
    "crates/noct-io",
    "crates/noct-elfloader",
    "crates/noct-fs",
    "crates/noct-multiboot",
    "crates/noct-elf",
    "crates/noct-tty",
    "crates/noct-video",
    "crates/noct-descriptor",
    "crates/noct-input",
    "crates/noct-input-dispatcher",
    "crates/noct-rtc",
    "crates/noct-ioport",
    "crates/noct-acpi", "crates/noct-cmdline-parser", "crates/noct-ata",
]
resolver = "2"

[dependencies]
x86 = "0.52.0"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
spin = "0.12.3"
cfg-if = "1.0.4"
bitflags = "2.11.1"
multiboot2 = "0.26.1"

noct-acpi = { path = "crates/noct-acpi" }
noct-ata = { path = "crates/noct-ata" }
noct-boot = { path = "crates/noct-boot" }
noct-cpu = { path = "crates/noct-cpu" }
noct-rtc = { path = "crates/noct-rtc" }
noct-diskman = { path = "crates/noct-diskman" }
noct-fsman = { path = "crates/noct-fsman" }
noct-fs = { path = "crates/noct-fs" }
noct-fatfs = { path = "crates/noct-fatfs" }
noct-descriptor = { path = "crates/noct-descriptor" }
noct-mem = { path = "crates/noct-mem" }
noct-input = { path = "crates/noct-input" }
noct-input-dispatcher = { path = "crates/noct-input-dispatcher" }
noct-interrupts = { path = "crates/noct-interrupts" }
noct-iso9660 = { path = "crates/noct-iso9660" }
noct-logger = { path = "crates/noct-logger" }
noct-memdisk = { path = "crates/noct-memdisk" }
noct-pci = { path = "crates/noct-pci" }
noct-physmem-alloc = { path = "crates/noct-physmem-alloc" }
noct-ps2 = { path = "crates/noct-ps2" }
noct-smbios = { path = "crates/noct-smbios" }
noct-spec = { path = "crates/noct-spec" }
noct-sync = { path = "crates/noct-sync" }
noct-sysinfo = { path = "crates/noct-sysinfo" }
noct-tarfs = { path = "crates/noct-tarfs" }
noct-time = { path = "crates/noct-time" }
noct-tools = { path = "crates/noct-tools" }
noct-sched = { path = "crates/noct-sched" }
noct-elfloader = { path = "crates/noct-elfloader" }
noct-io = { path = "crates/noct-io" }
noct-ioport = { path = "crates/noct-ioport" }
noct-tty = { path = "crates/noct-tty" }
noct-video = { path = "crates/noct-video" }

# Profiles

[profile.release]
panic = "abort"
lto = true
strip = true
opt-level = 2

[profile.release_no_opt]
inherits = "release"
opt-level = 0

[profile.release_no_opt_sym]
inherits = "release"
strip = false
opt-level = 0

[profile.release_opt_sym]
inherits = "release"
strip = false
opt-level = 2

[profile.dev]
panic = "abort"
strip = false
lto = true
opt-level = 0
