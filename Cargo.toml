[lib]
crate-type = [ "staticlib" ]

[package]
name = "nocturne"
version = "0.1.0"
edition = "2024"

[dependencies]
x86 = "0.52.0"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
spin = "0.10.0"
elf = { version = "0.8.0", default-features = false }
bitflags = "2.10.0"
cfg-if = "1.0.4"


# Profiles

[profile.release]
panic = "abort"
lto = true
strip = true
opt-level = 2

[profile.release_no_opt]
inherits = "release"
opt-level = 0

[profile.dev]
panic = "abort"
strip = true
lto = true
opt-level = 0
codegen-units = 1
