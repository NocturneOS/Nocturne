set timeout=5

# Импорт модулей
insmod all_video
insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus
insmod gfxterm
insmod gfxmenu

# Настройка терминала
# terminal_input console
# terminal_output gfxterm

# Тема оформления

echo 'Loading kernel...'
multiboot /nocturne.elf
module /ramdisk
boot

